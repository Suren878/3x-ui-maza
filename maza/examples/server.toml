# Paths are relative to this file. Replace the origin, certificate paths and public key.
listen = "0.0.0.0:443"
origin = "https://vpn.example.com"
certificate = "/etc/maza/fullchain.pem"
private_key = "/etc/maza/tls-key.pem"
wireguard_endpoint = "127.0.0.1:51820"
idle_seconds = 180
max_connections = 128
max_tunnels = 64
# cover_page = "/etc/maza/index.html"

[[clients]]
id = "desktop"
public_key = "REPLACE_WITH_MAZA_KEYGEN_PUBLIC_KEY"
