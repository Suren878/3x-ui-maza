[package]
name = "maza"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

# Independent of the Apple SDK and its vendored TLS fork; builds on Linux and macOS.
[workspace]
resolver = "3"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
h2 = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
webpki-roots = "1"

[dev-dependencies]
awgtun = { git = "https://github.com/AYastrebov/awgtun.git", rev = "137c821ad7f166fe7e2acfdc8a6390282cc9103b", default-features = false }
rcgen = "0.13"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
