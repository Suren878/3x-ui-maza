# Merge into the existing panel project. Keep its database/bin volumes, web
# ingress, runtime restrictions and explicit VPN egress policy.
# Remove the prototype relay service and its TCP 9443 mapping after migration.
services:
  panel:
    image: ${MAZA_PANEL_IMAGE:?Set the verified native panel image digest}
    environment:
      MAZA_ENDPOINT: ${MAZA_ENDPOINT:?Set the public hostname and UDP port}
    ports:
      - "0.0.0.0:${MAZA_UDP_PORT:-9443}:9443/udp"
